<!--
  This is the single HTML page that loads the whole InvestMe app.
  React takes over the <div id="root"> below and renders every
  screen inside it (this is called a "Single Page App").
-->
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- width=device-width + initial-scale=1 makes the app render at
         real mobile size instead of a zoomed-out "desktop" view -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- PWA metadata: theme-color paints the browser's address bar / status bar -->
    <meta name="theme-color" content="#10201A" />
    <meta name="description" content="InvestMe - assistant personnel d'aide à la décision d'investissement" />

    <!-- iOS-specific tags so "Add to Home Screen" behaves like a real app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="InvestMe" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- The Web App Manifest tells mobile browsers this is an installable app -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon-192.png" />

    <title>InvestMe</title>

    <!--
      Design system: "Le Sentier d'Investissement" (the investment trail).
      Long-term investing framed as an expedition, not a sprint - a
      topographic-map feel instead of the generic navy/indigo SaaS look.
      Fraunces (display serif, ledger/signage character) for headings and
      key figures, Work Sans (humanist, mobile-legible) for body text.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Tailwind CSS loaded from a CDN (no build step / no config file needed).
      The script scans the page's class names and generates matching CSS
      on the fly, right in the browser.
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Extend Tailwind's default colors/fonts with InvestMe's "Sentier"
      // palette so we can write classes like bg-app, bg-card, text-accent,
      // text-sentier, font-display everywhere.
      // Guarded with "if (window.tailwind)" so a slow/blocked network
      // (offline, ad-blocker, restrictive proxy) can't throw an uncaught
      // error here and break the rest of the page's scripts.
      if (window.tailwind) {
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                app: '#10201A', // Nuit de Sapin - page background
                card: '#1B2E24', // Écorce - card background
                accent: '#4C9A6A', // Sentier - primary accent (was indigo)
                sentier: '#4C9A6A', // same as accent, named for the risk-badge system
                glacier: '#3E7CA6', // "Équilibré" badge, secondary accent
                grenat: '#8C3B4A', // "Dynamique" badge, losses/danger
                ambre: '#D99A3E', // waypoints, deadlines, warnings
                papier: '#F2EDE3', // warm off-white - primary text (dark mode) / page surface (light "Carte de jour" mode)
                brume: '#8FA396', // muted secondary text (dark mode only - too low-contrast on light backgrounds)
                // "Carte de jour" (daylight) variant, used only on the Profil
                // result screen: 'app' doubles as ink text, 'papier' as the
                // page surface, plus these 3 additions for sub-cards and
                // WCAG-readable accents on a light background.
                creme: '#FFFDF8', // sub-card surface on the light variant
                mousse: '#3E7A54', // darker green - readable positive/accent text on light bg
                ardoise: '#5C6E62', // darker muted text - readable on light bg (brume is too pale there)
              },
              fontFamily: {
                display: ['Fraunces', 'Georgia', 'serif'],
                sans: ['"Work Sans"', 'system-ui', 'sans-serif'],
              },
            },
          },
        }
      } else {
        console.warn('InvestMe: Tailwind CDN did not load - the app will be unstyled. Check your internet connection.')
      }
    </script>

    <!--
      Faint topographic contour-line texture for cards - the app's visual
      signature, kept subtle (4% opacity) so it reads as a texture, not an
      illustration. A plain CSS class since it's a repeating background
      image, easier to express here than as a Tailwind utility.
    -->
    <style>
      .topo-texture {
        background-image: repeating-radial-gradient(
          circle at 20% 30%,
          transparent 0,
          transparent 18px,
          rgba(242, 237, 227, 0.04) 19px
        );
      }

      /* Visible keyboard focus in Ambre - the browser default outline is
         low-contrast against this dark palette, so every focusable
         element gets a consistent, clearly visible ring instead. */
      :focus-visible {
        outline: 2px solid #d99a3e;
        outline-offset: 2px;
        border-radius: 2px;
      }
    </style>
  </head>
  <body class="bg-app font-sans text-papier antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
